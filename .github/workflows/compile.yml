name: Compile

on:
  push:
    paths:
      - '*.c'
  workflow_dispatch:

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set env
        run: echo "commit=$(echo ${{ github.sha }} | cut -c-7)" >> $GITHUB_ENV

      - name: Compile
        run: $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang -Os -static -s -Wl,--gc-sections -o mkfrp@${{ env.commit }} mkfrp.c

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: mkfrp@${{ env.commit }}